[tool.ruff]
target-version = "py311"
line-length = 120
# Config vive en la raíz del repo; el código Python vive en backend/.
exclude = ["backend/uploads", ".venv", "node_modules", "dist", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = [
  "E501",  # long lines happen (URLs, f-strings); not worth failing the build over
  "E701",  # this codebase deliberately uses one-liners (`try: import x; FLAG = True`) for dense capability-flag blocks
  "E702",  # same as E701, semicolon-separated statement variant
  "B008",  # FastAPI's Depends()/Query() defaults are the documented pattern, not a real bug
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F401", "F811", "E402"]  # sys.path.insert() before imports is intentional in these test files
"backend/main.py" = ["E402"]  # router imports are placed after `app = FastAPI(...)` deliberately, grouped by section
