[package]
name = "sythrall-terminal"
# **Fase 35** — alineada con la del producto (`package.json`). El crate decia
# 0.1.0 desde siempre y no importaba, porque la version que el cliente veia la
# daba `main.py` como literal ("Sythrall v4.12"). Ahora el motor la reporta en
# `/capabilities` desde `CARGO_PKG_VERSION`, asi que las dos tienen que
# coincidir o el producto se anuncia con un numero equivocado.
version = "5.1.0"
edition = "2021"

[[bin]]
name = "terminal-server"
path = "services/terminal/src/main.rs"

[[bin]]
name = "complexity-engine"
path = "services/complexity/src/main.rs"

[lib]
name = "complexity_core"
path = "services/complexity/src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "signal"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
futures-util = "0.3"
portable-pty = "0.8"
rand = "0.8"
subtle = "2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rustpython-parser = "0.4"
ciborium = "0.2"
regex = "1"
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
tree-sitter-fortran = "0.6.0"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
# Gramatica de Ada (Fase 34, Linea E — paso 1: Ada como lenguaje ANALIZADO).
# Verificada contra el tree-sitter 0.25 de arriba antes de agregarla: ABI
# compatible, parsea Ada real sin errores. Las etapas que dependen de GNAT
# (codigo maquina, SPARK) no necesitan esta dependencia y siguen bloqueadas
# por el toolchain, no por el diseno.
tree-sitter-ada = "0.1"

# Gramatica de D (Fase 34, Linea C — paso 1 del orden interno que fija el
# ROADMAP: `@trusted`/`@system`). D entro a esa linea por GRADUAR la frontera
# de confianza en tres niveles donde Rust tiene dos, y para medir eso hay que
# leer los atributos de cada funcion, no compilar sondas como hace `dcost.rs`.
tree-sitter-d = "0.8"
object = "0.36"
# DEFLATE para leer ZIPs (`servicio/zip.rs`, Fase 35). **Ya estaba en el arbol
# de dependencias**: `object` la usa para las secciones comprimidas de los
# ejecutables, asi que declararla no agrega una sola linea nueva a compilar —
# solo la hace accesible. El contenedor ZIP se lee a mano (~120 lineas de un
# formato documentado); lo que NO se reimplementa es el algoritmo de
# compresion. Misma division que con `toml`/`object`/`tree-sitter`: leer un
# formato estandar si, reconstruir un algoritmo ajeno no.
flate2 = "1"
# Cliente HTTP+TLS para `/analyze/api` (`servicio/apis.rs`, Fase 35), el
# chequeo de salud de APIs externas. Decidido por el usuario el 2026-11-15.
#
# `hyper`, `hyper-util` y `http-body-util` YA estaban en el arbol porque axum
# los usa del lado servidor; lo unico nuevo es la capa TLS. Se eligio el
# conjunto minimo a proposito: `default-features = false` saca HTTP/2 y el
# almacen de certificados del sistema, `ring` en vez de `aws-lc-rs` evita un
# build de C, y `webpki-tokio` usa las raices embebidas de `webpki-roots`, que
# son las mismas de Mozilla y no dependen de como este configurada la maquina.
#
# TLS no se reimplementa jamas: es criptografia, y la regla del proyecto es no
# reconstruir algoritmos ajenos. Misma categoria que `flate2` para DEFLATE.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "webpki-tokio", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# `hyper` y `rustls` ya estaban en el arbol (axum y hyper-rustls los traen);
# se declaran para poder nombrarlos desde el codigo. No agregan nada nuevo a
# compilar. `rustls` con `default-features = false` + `ring`: el proveedor
# criptografico se elige explicito y se evita el build de C de aws-lc-rs.
hyper = { version = "1", features = ["client", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
# Parser TOML para `Cargo.toml`/`pyproject.toml` en `manifest.rs`. El doc de
# ese modulo dejo escrito que se agregaba "cuando haya un motivo, no antes";
# el motivo es cerrar el grafo de dependencias multi-lenguaje. Es un parser de
# FORMATO, de la misma familia que `serde_json`/`tree-sitter`/`object` que ya
# son dependencias — la regla del proyecto es no reconstruir ANALISIS ajeno,
# no evitar leer formatos estandar. `default-features = false` saca el
# serializador y `toml_edit`, que no se usan: solo hace falta leer.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "complexity_bench"
path = "services/complexity/benches/complexity_bench.rs"
harness = false

[[bench]]
name = "parse_bench"
path = "services/complexity/benches/parse_bench.rs"
harness = false

[[bench]]
name = "graph_bench"
path = "services/complexity/benches/graph_bench.rs"
harness = false

[[bench]]
name = "jsts_bench"
path = "services/complexity/benches/jsts_bench.rs"
harness = false

[[bench]]
name = "cparse_bench"
path = "services/complexity/benches/cparse_bench.rs"
harness = false

[profile.release]
opt-level = 2
