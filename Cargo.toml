[package]
name = "codewatch-terminal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terminal-server"
path = "terminal-server/src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
rand = "0.8"
subtle = "2.5"
hex = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2
