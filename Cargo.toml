[package]
name = "sythrall-terminal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terminal-server"
path = "services/terminal/src/main.rs"

[[bin]]
name = "complexity-engine"
path = "services/complexity/src/main.rs"

[lib]
name = "complexity_core"
path = "services/complexity/src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
rand = "0.8"
subtle = "2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rustpython-parser = "0.4"
ciborium = "0.2"
regex = "1"
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
tree-sitter-fortran = "0.6.0"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
# Gramatica de Ada (Fase 34, Linea E — paso 1: Ada como lenguaje ANALIZADO).
# Verificada contra el tree-sitter 0.25 de arriba antes de agregarla: ABI
# compatible, parsea Ada real sin errores. Las etapas que dependen de GNAT
# (codigo maquina, SPARK) no necesitan esta dependencia y siguen bloqueadas
# por el toolchain, no por el diseno.
tree-sitter-ada = "0.1"

# Gramatica de D (Fase 34, Linea C — paso 1 del orden interno que fija el
# ROADMAP: `@trusted`/`@system`). D entro a esa linea por GRADUAR la frontera
# de confianza en tres niveles donde Rust tiene dos, y para medir eso hay que
# leer los atributos de cada funcion, no compilar sondas como hace `dcost.rs`.
tree-sitter-d = "0.8"
object = "0.36"
# Parser TOML para `Cargo.toml`/`pyproject.toml` en `manifest.rs`. El doc de
# ese modulo dejo escrito que se agregaba "cuando haya un motivo, no antes";
# el motivo es cerrar el grafo de dependencias multi-lenguaje. Es un parser de
# FORMATO, de la misma familia que `serde_json`/`tree-sitter`/`object` que ya
# son dependencias — la regla del proyecto es no reconstruir ANALISIS ajeno,
# no evitar leer formatos estandar. `default-features = false` saca el
# serializador y `toml_edit`, que no se usan: solo hace falta leer.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "complexity_bench"
path = "services/complexity/benches/complexity_bench.rs"
harness = false

[[bench]]
name = "parse_bench"
path = "services/complexity/benches/parse_bench.rs"
harness = false

[[bench]]
name = "graph_bench"
path = "services/complexity/benches/graph_bench.rs"
harness = false

[[bench]]
name = "jsts_bench"
path = "services/complexity/benches/jsts_bench.rs"
harness = false

[[bench]]
name = "cparse_bench"
path = "services/complexity/benches/cparse_bench.rs"
harness = false

[profile.release]
opt-level = 2
