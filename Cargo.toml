[package]
name = "sythrall-terminal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terminal-server"
path = "services/terminal/src/main.rs"

[[bin]]
name = "complexity-engine"
path = "services/complexity/src/main.rs"

[lib]
name = "complexity_core"
path = "services/complexity/src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
portable-pty = "0.8"
rand = "0.8"
subtle = "2.5"
hex = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rustpython-parser = "0.4"
ciborium = "0.2"
regex = "1"
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
tree-sitter-fortran = "0.6.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "complexity_bench"
path = "services/complexity/benches/complexity_bench.rs"
harness = false

[[bench]]
name = "parse_bench"
path = "services/complexity/benches/parse_bench.rs"
harness = false

[[bench]]
name = "graph_bench"
path = "services/complexity/benches/graph_bench.rs"
harness = false

[[bench]]
name = "jsts_bench"
path = "services/complexity/benches/jsts_bench.rs"
harness = false

[[bench]]
name = "cparse_bench"
path = "services/complexity/benches/cparse_bench.rs"
harness = false

[profile.release]
opt-level = 2
