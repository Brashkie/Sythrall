# Todos los Dockerfiles viven acá mismo (docker/), no dispersos dentro de
# cada apps/services/*. El build context de los 4 servicios sigue siendo la
# RAÍZ del repo (`context: ..`, relativo a este archivo) — no `docker/` — así
# que las rutas de COPY dentro de cada Dockerfile no cambian: siguen siendo
# relativas al repo (`COPY apps/api/ .`, `COPY services/terminal/ ...`, etc.).
#
# IMPORTANTE: `.dockerignore` se queda en la raíz del repo a propósito, no
# acá — Docker solo lo lee desde el directorio que es el build CONTEXT
# (la raíz, por `context: ..`), nunca desde el directorio del Dockerfile.
# Moverlo a docker/ lo dejaría de aplicar en silencio (contexto de build
# gigante, node_modules/.git incluidos) sin ningún error visible.
services:

  backend:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: sythrall-backend
    restart: unless-stopped
    ports:
      - "8420:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Nombre del servicio Docker, no 127.0.0.1 — dentro de la red de
      # docker-compose cada contenedor se resuelve por su nombre de servicio.
      - COMPLEXITY_ENGINE_URL=http://complexity:7682
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - sythrall-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: sythrall-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sythrall-net

  terminal:
    build:
      context: ..
      dockerfile: docker/terminal.Dockerfile
    container_name: sythrall-terminal
    restart: unless-stopped
    ports:
      - "7681:7681"
    environment:
      # Dentro del contenedor 127.0.0.1 no es alcanzable vía el mapeo de puertos
      # de Docker — el aislamiento real ya lo da la red del contenedor/el mapeo
      # de puertos explícito, no el bind interno.
      - TERMINAL_HOST=0.0.0.0
    networks:
      - sythrall-net

  complexity:
    build:
      context: ..
      dockerfile: docker/complexity.Dockerfile
    container_name: sythrall-complexity
    restart: unless-stopped
    ports:
      - "7682:7682"
    environment:
      - COMPLEXITY_HOST=0.0.0.0
    networks:
      - sythrall-net

volumes:
  uploads_data:    # proyectos subidos persisten entre reinicios

networks:
  sythrall-net:
    driver: bridge
