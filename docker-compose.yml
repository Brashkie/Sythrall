services:

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sythrall-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Nombre del servicio Docker, no 127.0.0.1 — dentro de la red de
      # docker-compose cada contenedor se resuelve por su nombre de servicio.
      - COMPLEXITY_ENGINE_URL=http://complexity:7682
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - sythrall-net

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.frontend
    container_name: sythrall-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sythrall-net

  terminal:
    build:
      context: .
      dockerfile: services/terminal/Dockerfile
    container_name: sythrall-terminal
    restart: unless-stopped
    ports:
      - "7681:7681"
    environment:
      # Dentro del contenedor 127.0.0.1 no es alcanzable vía el mapeo de puertos
      # de Docker — el aislamiento real ya lo da la red del contenedor/el mapeo
      # de puertos explícito, no el bind interno.
      - TERMINAL_HOST=0.0.0.0
    networks:
      - sythrall-net

  complexity:
    build:
      context: .
      dockerfile: services/complexity/Dockerfile
    container_name: sythrall-complexity
    restart: unless-stopped
    ports:
      - "7682:7682"
    environment:
      - COMPLEXITY_HOST=0.0.0.0
    networks:
      - sythrall-net

volumes:
  uploads_data:    # proyectos subidos persisten entre reinicios

networks:
  sythrall-net:
    driver: bridge
