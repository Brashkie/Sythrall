services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codewatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - codewatch-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    container_name: codewatch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codewatch-net

volumes:
  uploads_data:    # proyectos subidos persisten entre reinicios

networks:
  codewatch-net:
    driver: bridge
